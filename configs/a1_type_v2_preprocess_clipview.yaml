# Minimum Viable Baseline. Freeze this once it produces numbers.
name: a1_type_v2_preprocess_clipview
seed: 42

data:
  # catalog_images / query_images feed the split builder (W4). The harness
  # reads image paths from split_manifest only.
  catalog_images: data/processed/catalog
  query_images:   data/processed/query
  split_manifest: D:/car_search_data/eda/type_v2/splits_type_v2_eval.json   # gallery as catalogue; queries.valid = 1,022 seen-type queries
  eval_split:     valid          # test is SEALED until April

embed:
  # ADR 001: same model, library and code path as the deployed service.
  # The harness imports pipeline.embedding.CLIPEmbedding from $SERVICE_REPO
  # rather than re-implementing it, so evaluated == deployed by construction.
  backend: service
  model: openai/clip-vit-large-patch14
  library: transformers
  dim: 768
  image_size: 224                # CLIPProcessor resizes and centre-crops to this
  normalize: true                # L2, inside CLIPEmbedding. Asserted by tests/test_embed.py
  batch_size: 32
  fp16: false                    # CLIPEmbedding runs fp32; see ADR 001 consequences

index:
  backend: qdrant
  collection: a1_type_v2
  metric: cosine                 # embeddings are L2-normalised; asserted by tests
  exact: true                    # brute force. Metrics measure the embedding, not
                                 # HNSW recall. A8 sweeps this against the ANN path.
  hnsw:                          # ignored while exact: true, used by A8 and the service
    m: 32
    ef_construct: 100
    ef_search: 64

query:
  region: full_image             # A1 sweeps: full_image | centre_70 | crop_00 | crop_10 | crop_15 | crop_20
                                 # crop_NN = YOLO box + NN% padding, whole image if no box (service rule since 2026-11-01)
  detector:                      # used by crop_* only; same weights and threshold as the service
    model: hf://albkue/car-parts-yolov8/best.pt
    confidence: 0.5
  preprocess: true              # service AdaptivePreprocessor on queries (catalogue stays raw,
                                 # as the service indexes it). The deployed path is true; the
                                 # preprocessing ablation compares the two.
  use_ocr: false
  use_metadata: false
  use_fusion: false

eval:
  k: [1, 5, 10]
  bootstrap_resamples: 1000
  ci: 0.95
  pool_images_to_part: max
